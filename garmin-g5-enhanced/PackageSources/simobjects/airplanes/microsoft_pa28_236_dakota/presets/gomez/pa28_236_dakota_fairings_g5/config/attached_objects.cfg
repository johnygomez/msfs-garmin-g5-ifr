; Mirrors the stock "fairings" preset. The only difference is SIM_ATTACHMENT.1, which swaps
; microsoft/Function_Interior for gomez/Function_Interior_G5 - the same cockpit model and
; behaviours, with the attitude indicator and the HSI replaced by two G5 units.
; The eight [MODULAR_MERGE] sibling files are the stock preset's, verbatim: without them the
; preset inherits no flight model, reference points or cockpit config from common/.

[SIM_ATTACHMENT.0]
attachment = ""
attachment_root = "SimObjects\Airplanes\microsoft_PA28_236_Dakota\attachments\microsoft\Function_Exterior_Fairings"
attachment_file = "model/exterior.xml"
attach_to_model = "exterior"
attach_to_model_minsize = 10
attach_to_node = ""
attach_offset = 0,0,0
attach_pbh = 0,0,0
attach_scale = 1
texture = ""
always_execute_associate_js = 0
always_execute_model_behavior = 0
alias = "Exterior_Fairings"

[SIM_ATTACHMENT.1]
attachment = ""
attachment_root = "SimObjects\Airplanes\microsoft_PA28_236_Dakota\attachments\gomez\Function_Interior_G5"
attachment_file = "model/Interior_G5.xml"
attach_to_model = "interior"
attach_to_model_minsize = 10
attach_to_node = ""
attach_offset = 0,0,0
attach_pbh = 0,0,0
attach_scale = 1
texture = ""
always_execute_associate_js = 0
always_execute_model_behavior = 0
alias = "Cockpit"