; PA28-236 Dakota panel with the attitude indicator and the HSI replaced by two G5 units.
;
; This attachment deliberately does NOT [Inherit] microsoft/Function_Interior: an inherited
; attachment's attached_objects.cfg is appended to its base's, never merged over it, so the stock
; ATTITUDE and HSI could not be suppressed that way - they would clip through the G5 bezels.
; The list below is therefore declared in full, keeping Microsoft's own SIM_ATTACHMENT indices so
; it stays diffable against attachments/microsoft/Function_Interior/config/attached_objects.cfg
; when the aircraft is updated. Only .3 (ATTITUDE) and .11 (HSI) differ.
;
; Everything else still points at Microsoft's own folders - nothing is copied, only referenced,
; and no geometry of our own is introduced.
;
; The Dakota's panel carries no attach point for the six-pack holes: its instruments use
; attach_to_node="" and hold their absolute panel position inside their own glTF. So both G5s
; hang off ROOT_PANEL - Microsoft's own unrotated panel root, merged in by MERGE_MODEL.0 at
; 0.00000, 0.21744, 0.72246 - and reach their hole with attach_offset alone. The offsets resolve
; to these absolute positions (interior model space, metres), measured off the stock instruments:
;   x 0.24537  - shared centreline of the ATTITUDE and HSI glass discs
;   y 0.26799  - ATTITUDE glass centre;  y 0.17620 - HSI hole centre (glass 0.17583, card 0.17668)
;   z 0.72200  - puts the G5 bezel front (model-local z -0.00540) on 0.71660, standing it
;                10.7 mm proud of the panel fascia. That stand-off is a judged look, not a
;                derived figure - it is where the unit was dialled in on screen. The fascia
;                itself is the 'panel' mesh of the cockpit model: sampling its vertices within
;                55 mm of each hole gives a front face at 0.72733 (AI) and 0.72701 (HSI), flat
;                to well under a millimetre. Do NOT line the G5 up with the stock gauge bezels
;                (0.73440-0.73600) instead: those round gauges sit recessed inside their holes,
;                so matching them insets the G5 by ~9 mm behind the fascia. At 0.72200 the
;                unit's back (local +0.01308) still lands inside the panel plate, on 0.73508,
;                and the knob tip reaches 0.70137 against 0.71465-0.71535 for the stock knobs.
; attach_offset uses the same axes and signs as the model space, which is why the C172's -0.01 on
; z stands its G5 proud of the panel rather than burying it. attach_pbh stays zero: the panel is
; vertical and the G5 model bakes its own facing rotation.

[MERGE_MODEL.0]
merge_file="SimObjects\Airplanes\microsoft_PA28_236_Dakota\attachments\microsoft\AttachPoints\model\MERGE_PANEL.gltf"
merge_to_model = "interior"

[MERGE_MODEL.1]
merge_file="SimObjects\Airplanes\microsoft_PA28_236_Dakota\attachments\microsoft\AttachPoints\model\AP_PILOT.gltf"
merge_to_model = "interior"

