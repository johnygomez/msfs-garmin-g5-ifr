attach_to_node="Object1511763689"
attach_to_reference_point=""
attach_offset=0,0.0915,-0.0120
attach_pbh=0,0,0
attach_scale=1.0991
always_execute_associate_js=1
always_execute_model_behavior=1
behavior_parameter.0="CIRCUIT_ID,27"
behavior_parameter.1="MFD_ID,1"
behavior_parameter.2="CIRCUIT_NAME,G5_1"
behavior_parameter.3="EMISSIVE_MIN,0.01"
behavior_parameter.4="BRIGHTNESS_SCALE,0.25"
behavior_parameter.5="USE_AMBIENT_POLYFILL,1"
vcockpit_parameter.0="VCockpit01_htmlgauge00_file,NavSystems/AS5/AS5.html"
vcockpit_parameter.1="VCockpit01_htmlgauge00_params,?Index=1"
alias="G5_MFD_1"

