; The C182RG reports a constant AMBIENT LIGHT SENSOR, so USE_AMBIENT_POLYFILL swaps it for a
; synthetic value derived from sun elevation. BRIGHTNESS_SCALE is the non-daylight cap, unused
; while the polyfill drives brightness - to revert, set polyfill 0 and BRIGHTNESS_SCALE back to 0.05.
; Anchor Object1511763689 is the HSI case: root-level, identity rotation, static, and the only
; node on the instrument column that is not animated. Carenado bakes a uniform 0.9098 scale into
; it, so attach_scale cancels that and the offsets below are world metres divided by 0.9098.
; CIRCUIT_ID must stay in sync with the circuit.N indices in systems.cfg.

