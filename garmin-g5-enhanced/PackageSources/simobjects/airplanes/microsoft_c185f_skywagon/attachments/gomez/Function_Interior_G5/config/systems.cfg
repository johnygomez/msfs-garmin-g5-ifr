; Each G5 sits on its own bus fed from the aircraft's single Avionics_BUS through a 5 A breaker.
; ConWithBreaker_5 and ConsumerCircuitA are the C185F's own definitions (common/config/systems.cfg);
; the C172 variant's Con_CB_5A does not exist on this airframe. The circuits are addressed by name
; hash ('G5_1'_n / 'G5_2'_n) from attached_objects.cfg, so their merged indices do not matter.

[VERSION]
major = 1
minor = 0

[ELECTRICAL]
circuit.1 = Type:CIRCUIT_MFD # ConsumerCfg:ConsumerCircuitA # Name:G5_1
circuit.2 = Type:CIRCUIT_MFD # ConsumerCfg:ConsumerCircuitA # Name:G5_2
bus.1 = Name:G5_1_BUS
bus.2 = Name:G5_2_BUS
line.1 = Name:Avionics_BUS_To_G5_1_BUS # Connection:ConWithBreaker_5(Avionics_BUS,G5_1_BUS)
line.2 = Name:G5_1_BUS_To_G5_1 # Connection:ConA(G5_1_BUS,G5_1)
line.3 = Name:Avionics_BUS_To_G5_2_BUS # Connection:ConWithBreaker_5(Avionics_BUS,G5_2_BUS)
line.4 = Name:G5_2_BUS_To_G5_2 # Connection:ConA(G5_2_BUS,G5_2)
