; C185F Skywagon panel with the vacuum attitude indicator and directional gyro replaced by two G5 units.
;
; This attachment deliberately does NOT [Inherit] microsoft/Function_Interior: an inherited
; attachment's attached_objects.cfg is appended to its base's, never merged over it, so the stock
; AttitudeIndicator and Gyro could not be suppressed that way - they would clip through the G5
; bezels. The list below is therefore declared in full, keeping Microsoft's own SIM_ATTACHMENT
; indices so it stays diffable against attachments/microsoft/Function_Interior/config/attached_objects.cfg
; when the aircraft is updated. Only .0 (AttitudeIndicator) and .12 (Gyro) differ.
;
; Every attachment still points at Microsoft's own folders - nothing is copied, only referenced.

[MERGE_MODEL.0]
merge_file="SimObjects\Airplanes\microsoft_C185F_Skywagon\attachments\microsoft\Attach_CHR\model\ATP_CHR.gltf"
merge_to_model = "interior"

[MERGE_MODEL.1]
merge_file="SimObjects\Airplanes\microsoft_C185F_Skywagon\attachments\microsoft\Part_Attachment\model\Attach_POINTS.gltf"
merge_to_model = "interior"

; ==== G5 #1 - PFD, in the attitude indicator hole ====
[SIM_ATTACHMENT.0]
attachment_root="SimAttachments/Instruments/gomez_attitude_indicator_g5"
attachment_file="model/mfd_g5.xml"
attach_to_model="Interior"
attach_to_model_minsize=1
attach_to_node="Attach_POINT_AttitudeIndicator"
attach_to_reference_point=""
attach_offset=0,0,-0.0120
attach_pbh=0,0,0
attach_scale=1.0
always_execute_associate_js=1
always_execute_model_behavior=1
behavior_parameter.0="CIRCUIT_ID,'G5_1'_n"
behavior_parameter.1="MFD_ID,1"
behavior_parameter.2="CIRCUIT_NAME,G5_1"
behavior_parameter.3="EMISSIVE_MIN,0.01"
behavior_parameter.4="BRIGHTNESS_SCALE,0.25"
behavior_parameter.5="USE_AMBIENT_POLYFILL,1"
behavior_parameter.6="NO_FLIGHT_DIRECTOR,1"
vcockpit_parameter.0="VCockpit01_htmlgauge00_file,NavSystems/AS5/AS5.html"
vcockpit_parameter.1="VCockpit01_htmlgauge00_params,?Index=1"
alias="G5_MFD_1"

