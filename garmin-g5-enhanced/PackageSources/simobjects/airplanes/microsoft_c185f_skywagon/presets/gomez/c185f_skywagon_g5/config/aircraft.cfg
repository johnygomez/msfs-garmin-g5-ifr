; The UI strings have to be re-declared here, qualified with the aircraft's own package name.
; common/config/aircraft.cfg spells them as bare "TT:AIRCRAFT.*" tokens, which resolve against the
; package that owns the final aircraft.cfg - ours - where they do not exist, so the aircraft
; selection screen falls back to printing the raw token names.
; "@microsoft-aircraft-c185f-skywagon,TT:..." points them back at Microsoft's own localisation
; instead. Same fix as the PA28-236 Dakota and C152 presets.

[MODULAR_MERGE]
auto = true

[FLTSIM.0]
title = "C185F Skywagon G5" ; Variation name
ui_manufacturer = "@microsoft-aircraft-c185f-skywagon,TT:AIRCRAFT.UI_MANUFACTURER"
ui_type = "@microsoft-aircraft-c185f-skywagon,TT:AIRCRAFT.UI_MODEL"
description = "@microsoft-aircraft-c185f-skywagon,TT:AIRCRAFT.DESCRIPTION"
ui_variation = "Standard + G5"
isUserSelectable = 1
isAirTraffic = 0
