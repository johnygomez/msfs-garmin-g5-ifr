; C152 panel with the attitude indicator and the directional gyro replaced by two G5 units.
;
; The list is declared in full and this attachment does NOT [Inherit] asobo/Function_Interior_C152.
; An inherited attached_objects.cfg is merged by appending its indexed sections to the base's and
; re-indexing them, never by overriding one in place, so inheriting would keep the stock gauges and
; render them through the G5 bezels. Asobo's indices are kept below so this stays diffable against
; attachments/asobo/Function_Interior_C152/config/attached_objects.cfg when the aircraft is updated;
; only .2 (heading indicator) and .4 (attitude indicator) differ.
;
; The three surviving instruments still point at Asobo's own SimAttachments - nothing is copied,
; only referenced, and no geometry of our own is introduced.
;
; The G5s are attached HERE rather than from the preset, because the panel's attach points exist
; only inside this attachment's cockpit glTF. The C152 ships no MERGE_MODEL to lift them into the
; aircraft's interior model, so a preset-level entry cannot resolve them - it silently falls back to
; the model origin and the unit ends up behind the panel.
;
; Both holes are empty nodes (no mesh, no children) already carrying the panel's mounting tilt, so
; attach_pbh stays zero and the units pick the tilt up for free. attach_offset uses the interior
; model axes, where -z is aft, towards the pilot. The figures below stand each G5 12 mm proud of the
; panel fascia, measured off Part_Interior_Cockpit/model/C152_COCKPIT_LOD00.gltf: fitting the
; MainPanel skin around each hole puts the fascia at z 0.64540 (attitude) and 0.64180 (gyro), while
; the attach points sit 8.7 mm and 3.8 mm forward of it respectively - which is why the two offsets
; differ by 5 mm for the same result. The G5's own bezel front is at model-local z -0.00540.
; To sit them deeper or prouder, move both by the same amount; 10 mm is what the other airframes
; were dialled in at.
;
; NO_FLIGHT_DIRECTOR is 1 because the C152 has no autopilot at all: common/config/systems.cfg sets
; autopilot_available = 0 and flight_director_available = 0.

[SIM_ATTACHMENT.0]
attachment="SimAttachments/Instruments/asobo_altimeter_01/model/altimeter_01.xml"
attach_to_model="interior"
attach_to_model_minsize=1 ; attaches to LODs that have a minSize of at least this value
attach_to_node="ATTACH_POINT_CONTAINER_Altimeter_MB_InHg"
attach_offset=0,0.001,0 ;left/right, up/down, fore/back
attach_pbh=0,0,0
attach_scale=0.975
always_execute_associate_js=1 ; Par défaut : 0
always_execute_model_behavior=1 ; Par défaut : 0

[SIM_ATTACHMENT.1]
attachment="SimAttachments/Instruments/asobo_turn_coordinator_01/model/turn_coordinator_01.xml"
attach_to_model="interior"
attach_to_model_minsize=1 ; attaches to LODs that have a minSize of at least this value
attach_to_node="ATTACH_POINT_CONTAINER_TurnCoordinator"
attach_offset=0,-0.002,-0.006 ;left/right, up/down, fore/back
attach_pbh=0,0,0
attach_scale=1.05
always_execute_associate_js=1 ; Par défaut : 0
always_execute_model_behavior=1 ; Par défaut : 0

; ==== G5 #2 - HSI, in the directional gyro hole ====
[SIM_ATTACHMENT.2]
attachment_root="SimAttachments/Instruments/gomez_attitude_indicator_g5"
attachment_file="model/mfd_g5.xml"
attach_to_model="interior"
attach_to_model_minsize=1
attach_to_node="ATTACH_POINT_CONTAINER_HeadingIndicator_OneKn"
attach_to_reference_point=""
attach_offset=0,0,-0.01039
attach_pbh=0,0,0
attach_scale=1.0
always_execute_associate_js=1
always_execute_model_behavior=1
behavior_parameter.0="CIRCUIT_ID,'G5_2'_n"
behavior_parameter.1="MFD_ID,2"
behavior_parameter.2="CIRCUIT_NAME,G5_2"
behavior_parameter.3="EMISSIVE_MIN,0.01"
behavior_parameter.4="BRIGHTNESS_SCALE,0.05"
behavior_parameter.5="USE_AMBIENT_POLYFILL,0"
behavior_parameter.6="NO_FLIGHT_DIRECTOR,1"
vcockpit_parameter.0="VCockpit01_htmlgauge00_file,NavSystems/AS5/AS5.html"
vcockpit_parameter.1="VCockpit01_htmlgauge00_params,?Index=2"
alias="G5_MFD_2"

[SIM_ATTACHMENT.3]
attachment="SimAttachments/Instruments/asobo_adf_bearingindicator_01/model/bearingindicator_01.xml"
attach_to_model="interior"
attach_to_model_minsize=1 ; attaches to LODs that have a minSize of at least this value
attach_to_node="ATTACH_POINT_CONTAINER_ADF_OneKnob"
attach_offset=0,0,0 ;left/right, up/down, fore/back
attach_pbh=0,0,0
attach_scale=1.07
always_execute_associate_js=1 ; Par défaut : 0
always_execute_model_behavior=1 ; Par défaut : 0

; ==== G5 #1 - PFD, in the attitude indicator hole ====
[SIM_ATTACHMENT.4]
attachment_root="SimAttachments/Instruments/gomez_attitude_indicator_g5"
attachment_file="model/mfd_g5.xml"
attach_to_model="interior"
attach_to_model_minsize=1
attach_to_node="ATTACH_POINT_CONTAINER_AttitudeIndicator_KnobRotate"
attach_to_reference_point=""
attach_offset=0,0,-0.01528
attach_pbh=0,0,0
attach_scale=1.0
always_execute_associate_js=1
always_execute_model_behavior=1
behavior_parameter.0="CIRCUIT_ID,'G5_1'_n"
behavior_parameter.1="MFD_ID,1"
behavior_parameter.2="CIRCUIT_NAME,G5_1"
behavior_parameter.3="EMISSIVE_MIN,0.01"
behavior_parameter.4="BRIGHTNESS_SCALE,0.05"
behavior_parameter.5="USE_AMBIENT_POLYFILL,0"
behavior_parameter.6="NO_FLIGHT_DIRECTOR,1"
vcockpit_parameter.0="VCockpit01_htmlgauge00_file,NavSystems/AS5/AS5.html"
vcockpit_parameter.1="VCockpit01_htmlgauge00_params,?Index=1"
alias="G5_MFD_1"
