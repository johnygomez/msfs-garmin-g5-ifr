; Each G5 sits on its own bus fed from the C152's single Avionics_BUS through a 5 A breaker.
; ConWithBreaker_5, ConA and ConsumerCircuitA are the C152's own definitions (common/config/systems.cfg).
;
; These indices start at 1 because an *attachment* CFG's indexed parameters are appended to the
; common ones and re-indexed - the same thing the C172, C185F and PA28 attachments rely on. Do not
; move this file up to the preset: there the indices override common's by number instead, so
; circuit.1 replaces General_Panel_Main and the whole aircraft loses its electrical system.
; The circuits are addressed by name hash ('G5_1'_n / 'G5_2'_n) from attached_objects.cfg, so the
; indices they end up with do not matter.

[VERSION]
major = 1
minor = 0

[ELECTRICAL]
circuit.1 = Type:CIRCUIT_MFD # ConsumerCfg:ConsumerCircuitA # Name:G5_1
circuit.2 = Type:CIRCUIT_MFD # ConsumerCfg:ConsumerCircuitA # Name:G5_2
bus.1 = Name:G5_1_BUS
bus.2 = Name:G5_2_BUS
line.1 = Name:Avionics_BUS_To_G5_1_BUS # Connection:ConWithBreaker_5(Avionics_BUS,G5_1_BUS)
line.2 = Name:G5_1_BUS_To_G5_1 # Connection:ConA(G5_1_BUS,G5_1)
line.3 = Name:Avionics_BUS_To_G5_2_BUS # Connection:ConWithBreaker_5(Avionics_BUS,G5_2_BUS)
line.4 = Name:G5_2_BUS_To_G5_2 # Connection:ConA(G5_2_BUS,G5_2)
