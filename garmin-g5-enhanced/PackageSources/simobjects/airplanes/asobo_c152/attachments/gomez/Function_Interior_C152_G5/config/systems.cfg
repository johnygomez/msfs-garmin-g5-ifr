; The stock C152 defines an avionics circuit (circuit.17) but never connects it to a bus, so
; CIRCUIT AVIONICS ON stays off and the G5 never sees power. This line feeds it from Avionics_BUS,
; which the C152 powers straight from the battery master, as it has no avionics master.
;
; Indices start at 1 because an attachment's indexed parameters are appended to the common ones and
; re-indexed. Do not move this file to the preset, where line.1 would replace the common line.1.

[VERSION]
major = 1
minor = 0

[ELECTRICAL]
line.1 = Name:Avionics_BUS_To_Avionics # Connection:ConA(Avionics_BUS,Avionics)
