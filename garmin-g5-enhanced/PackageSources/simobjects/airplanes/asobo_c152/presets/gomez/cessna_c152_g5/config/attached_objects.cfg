; Mirrors the stock "cessna_c152" preset. The only difference is SIM_ATTACHMENT.1, which swaps
; asobo/Function_Interior_C152 for gomez/Function_Interior_C152_G5 - the same cockpit geometry and
; behaviours, with the attitude indicator and the directional gyro replaced by two G5 units.
; No Asobo file is overridden and the two stock C152 presets are untouched, so the default aircraft
; is exactly as shipped.
; The eight [MODULAR_MERGE] sibling files and the navigation graph are the stock preset's, verbatim:
; without them the preset inherits no flight model, reference points or cockpit config from common/.

[SIM_ATTACHMENT.0]
attachment_root="SimObjects\Airplanes\Asobo_C152\attachments\asobo\Function_Exterior_C152"
attachment_file="model/C152_EXTERIOR.xml"
attach_to_model="exterior"
attach_to_model_minsize=0 ; attaches to LODs that have a minSize of at least this value
always_execute_associate_js=1 ; Par défaut : 0
always_execute_model_behavior=1 ; Par défaut : 0
alias="Exterior"

[SIM_ATTACHMENT.1]
attachment_root="SimObjects\Airplanes\Asobo_C152\attachments\gomez\Function_Interior_C152_G5"
attachment_file="model/C152_INTERIOR_G5.xml"
attach_to_model="interior"
attach_to_model_minsize=0 ; attaches to LODs that have a minSize of at least this value
always_execute_associate_js=1 ; Par défaut : 0
always_execute_model_behavior=1 ; Par défaut : 0
alias="Interior"
