; The UI strings have to be re-declared here, qualified with the aircraft's own package name.
; common/config/aircraft.cfg spells them as bare "TT:AIRCRAFT.*" tokens, which resolve against the
; package that owns the final aircraft.cfg - ours - where they do not exist, so the aircraft
; selection screen falls back to printing the raw token names. "@asobo-aircraft-c152,TT:..." points
; them back at Asobo's own localisation instead. Same fix as the PA28-236 Dakota preset.
; targeted_specializations is repeated from the stock "cessna_c152" preset so the G5 variant stays
; eligible for the same career specializations as the aircraft it replaces; everything else is
; merged in from common/.

[MODULAR_MERGE]
auto = true

[FLTSIM.0]
title = "Cessna C152 - G5" ; Variation name
ui_manufacturer = "@asobo-aircraft-c152,TT:AIRCRAFT.UI_MANUFACTURER"
ui_type = "@asobo-aircraft-c152,TT:AIRCRAFT.UI_MODEL"
description = "@asobo-aircraft-c152,TT:AIRCRAFT.DESCRIPTION"
ui_variation = "Standard + G5"
isUserSelectable = 1
targeted_specializations = FIF-PLN,FEF-PLN,TOR-PLN
