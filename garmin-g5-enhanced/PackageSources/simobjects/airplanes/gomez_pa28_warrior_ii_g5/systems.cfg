; G5 electrical for the Warrior II, as a merge over JF's systems.cfg rather than a copy.
;
; override_base_container = 0 is the same mechanism the DA50 livery uses in its panel.cfg:
; this file is merged onto the base container's systems.cfg instead of replacing it, so
; everything JF defines - LIGHTS, BRAKES, the other 26 circuits, AUTOPILOT, RADIOS and the
; rest - keeps coming from their file and keeps tracking their updates.
;
; The key ranges are disjoint by design, so nothing of JF's is shadowed:
;   JF:    bus.1-3   circuit.1-26   (no line.N entries at all)
;   ours:  bus.4-5   circuit.27-28  line.1-4
; If JF ever adds a bus.4 or a circuit.27, these collide silently - re-check on their updates.
;
; The G5s find their circuit by name, not index: attached_objects.cfg passes
; CIRCUIT_ID="'G5_1'_n", which resolves the name G5_1 to whatever index it lands on, so the
; numbering below can shift without breaking the instruments.

[VARIATION]
override_base_container = 0

[ELECTRICAL]
bus.4 = Name:G5_1_BUS#WearAndTearCollision:NoseDamageHigh,TailTopDamageHigh,TailBottomDamageHigh,LeftWingDamageLow,RightWingDamageLow
bus.5 = Name:G5_2_BUS#WearAndTearCollision:NoseDamageHigh,TailTopDamageHigh,TailBottomDamageHigh,LeftWingDamageLow,RightWingDamageLow

circuit.27 = Type:CIRCUIT_MFD # ConsumerCfg:ConsumerCircuitA # Name:G5_1#WearAndTearCollision:NoseDamageHigh,TailTopDamageHigh,TailBottomDamageHigh,LeftWingDamageLow,RightWingDamageLow
circuit.28 = Type:CIRCUIT_MFD # ConsumerCfg:ConsumerCircuitA # Name:G5_2#WearAndTearCollision:NoseDamageHigh,TailTopDamageHigh,TailBottomDamageHigh,LeftWingDamageLow,RightWingDamageLow

line.1 = Name:AVIONICS_BUS_To_G5_1_BUS # Connection:Con_CB_5A(Avionics_BUS,G5_1_BUS)#WearAndTearCollision:NoseDamageHigh,TailTopDamageHigh,TailBottomDamageHigh,LeftWingDamageLow,RightWingDamageLow
line.2 = Name:G5_1_BUS_To_G5_1 # Connection:ConA(G5_1_BUS,G5_1)#WearAndTearCollision:NoseDamageHigh,TailTopDamageHigh,TailBottomDamageHigh,LeftWingDamageLow,RightWingDamageLow
line.3 = Name:AVIONICS_BUS_To_G5_2_BUS # Connection:Con_CB_5A(Avionics_BUS,G5_2_BUS)#WearAndTearCollision:NoseDamageHigh,TailTopDamageHigh,TailBottomDamageHigh,LeftWingDamageLow,RightWingDamageLow
line.4 = Name:G5_2_BUS_To_G5_2 # Connection:ConA(G5_2_BUS,G5_2)#WearAndTearCollision:NoseDamageHigh,TailTopDamageHigh,TailBottomDamageHigh,LeftWingDamageLow,RightWingDamageLow
