; is chained back into JF's texture folders, which is the standard livery mechanism.
fallback.1=..\..\jf_pa28_warrior_ii\texture.cfoec
fallback.2=..\..\jf_pa28_warrior_ii\texture
fallback.3=..\..\jf_pa28_warrior_ii\texture.vc
