; The thumbnail*.png files beside this one have to be real files: the aircraft selector loads
; them by direct path and never consults the fallback chain below. Sizes are what the sim
; expects - thumbnail 720x344, thumbnail_button 830x260, thumbnail_side 930x340.
;
; CAUTION: they are currently JF's own renders with the blue trim hue-shifted to dark green,
; i.e. derivative works of Just Flight artwork. Fine locally, NOT fine to publish without
; their permission - replace with original artwork or an own screenshot before releasing.
;
; Also note they no longer match what the sim renders: the aircraft still loads JF's blue
; C-FOEC albedo through the fallbacks below, so the selector card and the actual aeroplane
; disagree until a real green livery exists.

[fltsim]

; base_container inherits the default-named folders (model/, sound/) but not suffixed
; ones, so each livery needs a local folder here. The artwork itself is not copied - it
; is chained back into JF's texture folders, which is the standard livery mechanism.
fallback.1=..\..\jf_pa28_warrior_ii\texture.cfoec
fallback.2=..\..\jf_pa28_warrior_ii\texture
fallback.3=..\..\jf_pa28_warrior_ii\texture.vc
