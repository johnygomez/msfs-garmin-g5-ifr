; ==== INTERIOR G5 INSTRUMENTS ====
;
; Local copy rather than inherited: root-level cfg files are not resolved through
; base_container the way the model/, panel/ and texture.* folders are, so without this the
; variant gets no SIM_ATTACHMENTs and the G5s never appear.
;
; Attach nodes "Attitude" and "Dir_ind" belong to JF's interior model, which we inherit.
;
; The vcockpit_parameter lines below feed the [DynamicParameters] in the attachment's own
; panel/panel.cfg, which is what actually creates each G5's VCockpit. The aircraft's panel
; folder deliberately adds no VCockpit for them - see the note in aircraft.cfg about why this
; variant must not have its own panel.<suffix> folder.

[SIM_ATTACHMENT.0]
attachment_root="SimAttachments/Instruments/gomez_attitude_indicator_g5"
attachment_file="model/mfd_g5.xml"
attach_to_model="interior"
attach_to_model_minsize=0
attach_to_node="Attitude"
attach_to_reference_point=""
attach_offset=0.0055,0,0.01
attach_pbh=0,0,180
attach_scale=1.0
always_execute_associate_js=1
always_execute_model_behavior=1
behavior_parameter.0="CIRCUIT_ID,'G5_1'_n"
behavior_parameter.1="MFD_ID,1"
behavior_parameter.2="CIRCUIT_NAME,G5_1"
vcockpit_parameter.0="VCockpit01_htmlgauge00_file,NavSystems/AS5/AS5.html"
vcockpit_parameter.1="VCockpit01_htmlgauge00_params,?Index=1"
alias="G5_MFD_1"

[SIM_ATTACHMENT.1]
attachment_root="SimAttachments/Instruments/gomez_attitude_indicator_g5"
attachment_file="model/mfd_g5.xml"
attach_to_model="interior"
attach_to_model_minsize=0
attach_to_node="Dir_ind"
attach_to_reference_point=""
attach_offset=0.006,-0.001,-0.005
attach_pbh=0,0,180
attach_scale=1.0
always_execute_associate_js=1
always_execute_model_behavior=1
behavior_parameter.0="CIRCUIT_ID,'G5_2'_n"
behavior_parameter.1="MFD_ID,2"
behavior_parameter.2="CIRCUIT_NAME,G5_2"
vcockpit_parameter.0="VCockpit01_htmlgauge00_file,NavSystems/AS5/AS5.html"
vcockpit_parameter.1="VCockpit01_htmlgauge00_params,?Index=2"
alias="G5_MFD_2"
