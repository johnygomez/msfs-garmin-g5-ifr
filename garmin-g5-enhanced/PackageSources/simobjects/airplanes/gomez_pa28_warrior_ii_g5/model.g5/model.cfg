; [model.options] copied verbatim from jf_pa28_warrior_ii/model/model.cfg.
;
; The exterior is referenced in place - its XML lives beside JF's glTF so its own relative
; LOD paths keep resolving. Only the interior is a local file, because it needs the
; hidden-gauge overrides; its LOD paths point back at JF's glTF so we never copy the ~131 MB
; of geometry.

[model.options]
withExterior_showInterior=true
withExterior_showInterior_hideFirstLod=true
withInterior_forceFirstLod=true
withInterior_showExterior=true

[models]
exterior=..\..\jf_pa28_warrior_ii\model\JF_PA28_WARRIOR_EXT.xml
interior=JF_PA28_WARRIOR_VC_G5.xml
