; Garmin G5 Enhanced variant of the Just Flight PA28 Warrior II.
;
; The JF Warrior II is a legacy (MSFS 2020 style) aircraft container, so the MSFS 2024
; modular preset system used for the C172 is not available here. This derived container is
; the legacy equivalent, and it is fully self-contained: JF's own package is never modified.
;
; base_container only resolves the default-named folders (model/, panel/, sound/, texture/).
; Root-level cfg files and suffixed folders such as texture.cfoec are NOT looked up in the
; base container, which is why almost everything below is carried locally.
;
; Carried locally:
;   systems.cfg          - only the G5 buses / circuits / lines, merged onto JF's via
;                          override_base_container = 0 (not a copy of their file)
;   attached_objects.cfg - the two G5 SIM_ATTACHMENTs
;   model.g5/            - JF's VC behaviours with the steam gauges hidden; the glTF itself
;                          is referenced back out of JF's model folder, never copied
;   texture.cfoec/       - texture.cfg fallback chain into JF's artwork, plus our own three
;                          thumbnail PNGs. The thumbnails have to be real files here: the
;                          selector loads them by direct path and never walks texture.cfg
;                          fallbacks, so they are the one thing that cannot be referenced.
;
; The liveries, the glTF, JF's model behaviours and their systems.cfg are all referenced or
; merged, never copied. The one exception is texture.cfoec/thumbnail*.png - see the warning
; in that folder's texture.cfg before publishing this package.
;
; Inherited from base_container:
;   sound/               - sound = ""
;   panel/               - panel = "". Do NOT give this variant its own panel.<suffix> folder.
;                          JF's jf_pa28_warrior_wasm.wasm lives in panel/, and every
;                          "wasm_module=JF_PA28_Warrior_WASM.wasm" in panel.cfg resolves
;                          relative to the aircraft's own panel folder. Point panel at
;                          anything else and all seven WASM gauges die - SystemWatch,
;                          GPS100, KN62, AstroTechTimer, EFB, Autopilot, Paper_chart - and
;                          because SystemWatch is JF's systems gauge, the whole electrical
;                          system stops with them.
;                          The G5 screens do not need an entry here: the attachment carries
;                          its own panel/panel.cfg (VCockpit01 on G5_Screen_1), driven by the
;                          vcockpit_parameter lines in attached_objects.cfg. Same as the C172
;                          preset, whose panel.xml is empty.
;
; Single livery on purpose - C-FOEC, JF's own FLTSIM.0. Adding more means one [FLTSIM.N] per
; livery plus a matching texture.<suffix>/ folder (fallback chain + its own thumbnails).

[VERSION]
major = 1
minor = 0

[VARIATION]
base_container = "..\jf_pa28_warrior_ii"

[FLTSIM.0]
title = "Just Flight PA28 Warrior II G5"
model = "g5"
panel = "" ; MUST stay empty - see header
sound = ""
texture = "CFOEC"
description = "TT:AIRCRAFT.DESCRIPTION"
wip_indicator = 0
ui_manufacturer = "Just Flight" ; must match the base aircraft so both group under one entry
ui_type = "PA28 Warrior II" ; must match the base aircraft so both group under one entry
ui_variation = "C-FOEC + Garmin G5"
ui_typerole = "Single Engine Prop"
ui_createdby = "Just Flight / Gomez"
ui_thumbnailfile = ""
ui_certified_ceiling = 13000
ui_max_range = 637
ui_autonomy = 5
ui_fuel_burn_rate = 50.5
atc_id = "C-FOEC"
atc_id_enable = 1
atc_heavy = 0
atc_parking_types = "RAMP"
isAirTraffic = 0 ; keep our variant out of AI traffic - JF's own entries already cover that
isUserSelectable = 1
