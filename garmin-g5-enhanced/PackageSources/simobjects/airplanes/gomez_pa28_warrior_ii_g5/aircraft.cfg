; Garmin G5 variant of the Just Flight PA28 Warrior II. JF's package is never modified.
;
; base_container only resolves the default-named folders (model/, panel/, sound/, texture/) -
; root-level cfgs and suffixed folders are not inherited and must be carried locally.
;
; panel MUST stay "". JF's WASM lives in their panel/ folder and every
; "wasm_module=JF_PA28_Warrior_WASM.wasm" resolves relative to the aircraft's own panel
; folder, so any panel.<suffix> here kills all seven WASM gauges - including SystemWatch,
; which takes the whole electrical system with it. The G5 screens don't need an entry: the
; attachment carries its own VCockpit.

[VERSION]
major = 1
minor = 0

[VARIATION]
base_container = "..\jf_pa28_warrior_ii"

[FLTSIM.0]
title = "Just Flight PA28 Warrior II G5"
model = "g5"
panel = "" ; MUST stay empty - see header
sound = ""
texture = "CFOEC"
description = "TT:AIRCRAFT.DESCRIPTION"
wip_indicator = 0
ui_manufacturer = "Just Flight" ; must match the base aircraft so both group under one entry
ui_type = "PA28 Warrior II" ; must match the base aircraft so both group under one entry
ui_variation = "C-FOEC + Garmin G5"
ui_typerole = "Single Engine Prop"
ui_createdby = "Just Flight / Gomez"
ui_thumbnailfile = ""
ui_certified_ceiling = 13000
ui_max_range = 637
ui_autonomy = 5
ui_fuel_burn_rate = 50.5
atc_id = "C-FOEC"
atc_id_enable = 1
atc_heavy = 0
atc_parking_types = "RAMP"
isAirTraffic = 0 ; keep our variant out of AI traffic - JF's own entries already cover that
isUserSelectable = 1
