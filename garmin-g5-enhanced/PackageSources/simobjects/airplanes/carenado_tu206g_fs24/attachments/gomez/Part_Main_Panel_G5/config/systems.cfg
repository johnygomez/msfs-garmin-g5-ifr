; Each G5 sits on its own bus fed from the aircraft's Avionics_BUS through a 5 A breaker.
; Avionics_BUS is confirmed by the Main_BUSToAvionics_BUS line in common/flt/*.flt, but Carenado
; ships systems.cfg encrypted, so the breaker, connection and consumer macros cannot be checked.
; They are therefore declared here under G5_ names instead of borrowing the host's.
; The circuits are addressed by name hash ('G5_1'_n / 'G5_2'_n) from attached_objects.cfg, so their
; merged indices do not matter.

[VERSION]
major = 1
minor = 0

[ELECTRICAL]
consumer.1 = Name:G5_ConsumerCircuit # Voltage:12 # Wattage:5
breaker.1 = Name:G5_Breaker_5 # RatedCurrent:5
connection.1 = Name:G5_ConA
connection.2 = Name:G5_ConWithBreaker_5 # Components:G5_Breaker_5
circuit.1 = Type:CIRCUIT_MFD # ConsumerCfg:G5_ConsumerCircuit # Name:G5_1
circuit.2 = Type:CIRCUIT_MFD # ConsumerCfg:G5_ConsumerCircuit # Name:G5_2
bus.1 = Name:G5_1_BUS
bus.2 = Name:G5_2_BUS
line.1 = Name:Avionics_BUS_To_G5_1_BUS # Connection:G5_ConWithBreaker_5(Avionics_BUS,G5_1_BUS)
line.2 = Name:G5_1_BUS_To_G5_1 # Connection:G5_ConA(G5_1_BUS,G5_1)
line.3 = Name:Avionics_BUS_To_G5_2_BUS # Connection:G5_ConWithBreaker_5(Avionics_BUS,G5_2_BUS)
line.4 = Name:G5_2_BUS_To_G5_2 # Connection:G5_ConA(G5_2_BUS,G5_2)
