; CT206G main panel with the attitude indicator and the HSI replaced by two G5 units.
;
; Mirrors attachments/carenado/Part_Main_Panel/config/attached_objects.cfg with Carenado's own
; SIM_ATTACHMENT indices, so it stays diffable against it when the aircraft is updated. Only .20
; (ADI) and .21 (HSI) differ. Everything else still points at Carenado's folders.
;
; Both G5s hang off the same attach points as the stock gauges. Measured on main_panel_lod01.gltf,
; the AP_ATTITUDEINDICATOR and AP_HSI nodes sit within 0.2 mm of their hole centres, with identity
; rotation, 1.5 mm behind the fascia front face (z 0.5349). attach_offset z -0.0069 puts the G5
; bezel front 10.7 mm proud of the fascia - the same stand-off as the PA28 Dakota. The G5 frame
; (86 x 92 mm) fully covers both holes. Carenado's stock ADI is recessed 6 mm behind the fascia,
; so do not line the G5 up with it.
;
; AttachPoints/model/MERGE_PANEL.gltf carries nodes with the same names, 30 mm lower and 19 mm
; closer. They are not the ones resolved here: from them the stock gauges would miss their holes.
; USE_AMBIENT_POLYFILL is on, as for the C185F and C182RG, so G5 brightness does not depend on how
; this aircraft reports AMBIENT LIGHT SENSOR.

