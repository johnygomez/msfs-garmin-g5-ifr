; Mirrors the stock "passenger standard" preset. The only difference is SIM_ATTACHMENT.2, which swaps
; carenado/Part_Main_Panel for gomez/Part_Main_Panel_G5 - the same panel model and behaviours, with
; the attitude indicator and the HSI replaced by two G5 units.
; The [MODULAR_MERGE] sibling files make the preset inherit common/'s flight model, reference points and
; cockpit config. flight_model.cfg also adds the reference speeds Carenado's flight model lacks.

[SIM_ATTACHMENT.0]
attachment = ""
attachment_root = "SimObjects\Airplanes\Carenado_TU206G_fs24\attachments\carenado\Function_Exterior"
attachment_file = "model/Exterior.xml"
attach_to_model = "exterior"
attach_to_model_minsize = 10
attach_to_node = ""
attach_offset = 0,0,0
attach_pbh = 0,0,0
attach_scale = 1
texture = ""
always_execute_associate_js = 0
always_execute_model_behavior = 0
alias = "Exterior"

[SIM_ATTACHMENT.1]
attachment = ""
attachment_root = "SimObjects\Airplanes\Carenado_TU206G_fs24\attachments\carenado\Function_Interior"
attachment_file = "model/Interior.xml"
attach_to_model = "interior"
attach_to_model_minsize = 10
attach_to_node = ""
attach_offset = 0,0,0
attach_pbh = 0,0,0
attach_scale = 1
texture = ""
always_execute_associate_js = 0
always_execute_model_behavior = 0
alias = "Cockpit"

[SIM_ATTACHMENT.2]
attachment_root="SimObjects\Airplanes\Carenado_TU206G_fs24\attachments\gomez\Part_Main_Panel_G5"
attachment_file="model/Main_Panel_G5.xml"
attach_to_model="interior"
attach_to_model_minsize=0
attach_to_node=""
alias="Main_Panel"

[SIM_ATTACHMENT.3]
attachment_root = SimObjects\Airplanes\Carenado_TU206G_fs24\attachments\carenado\Part_Seats
attachment_file = model/SEAT_CABIN.xml
attach_to_model = interior
